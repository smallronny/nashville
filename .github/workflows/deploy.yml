name: Deploy Astro to cPanel

on:
  push:
    branches: [ "main" ] # Cambia "main" por "master" si tu rama principal se llama así

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      # 1. Clonar el repositorio
      - name: Get latest code
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # O 'pnpm' / 'yarn' según el gestor que uses

      # 3. Instalar dependencias y compilar Astro
      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      # 4. Subir archivos compilados a cPanel vía FTP
      - name: Sync files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ # Carpeta que genera Astro al compilar
          server-dir: /public_html/astro/ # Ruta de destino en tu cPanel (ajusta si está en un subdominio)