name: Deploy to GitHub Pages

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # By default the workflow assumes a GitHub Pages project URL:
      # https://<owner>.github.io/<repository>/
      # To use a custom domain, create a repository variable named SITE_URL
      # (Settings → Secrets and variables → Actions → Variables) with
      # https://nashvillecraftingclub.com and optionally BASE_PATH=/.
      - name: Configure Astro for GitHub Pages
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_SITE_URL" ]; then
            echo "SITE_URL=$CUSTOM_SITE_URL" >> "$GITHUB_ENV"
            echo "BASE_PATH=${CUSTOM_BASE_PATH:-/}" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
            if [[ "${GITHUB_REPOSITORY#*/}" == *.github.io ]]; then
              echo "BASE_PATH=/" >> "$GITHUB_ENV"
            else
              echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Install, build and upload
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          PUBLIC_FORMSPREE_ID: ${{ vars.PUBLIC_FORMSPREE_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
